name: Store screenshots check

# By hand only: the App Store screenshots of every version, read with the same privacy check as the CI's own captures
# (scripts/shots-check.sh). Read-only API calls. A public repo's logs and artifacts are public, so nothing is uploaded
# and the log holds counts and categories only: a hit names its category and its number (007.png), never what it read.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'jt-wang/boop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: testflight
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare Apple API client and OCR
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-client"
          "$RUNNER_TEMP/asc-client/bin/pip" install --quiet PyJWT==2.10.1 cryptography==46.0.3
          sudo apt-get install -y -qq tesseract-ocr python3-pil fonts-dejavu-core >/dev/null
          scripts/shots-check.sh --self-test
      - name: Download the App Store screenshots
        run: '"$RUNNER_TEMP/asc-client/bin/python" -B scripts/store-shots.py "$RUNNER_TEMP/store-shots"'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      - name: Read them with the privacy check
        run: scripts/shots-check.sh "$RUNNER_TEMP/store-shots"
