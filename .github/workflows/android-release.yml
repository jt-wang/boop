name: Android release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full current main SHA to build
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: boop-android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jt-wang/boop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: boop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: boop
          persist-credentials: false
      - name: Check requested source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$GITHUB_WORKFLOW_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jt-wang/tailpocket
          ref: e197f3edca01ba4d1c70a6a752a5cad9a383cb0c
          path: tailpocket
          persist-credentials: false
      # v7 reads go.mod's toolchain line (v5 took the go line: go1.27.1 for toolchain go1.27.4)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tailpocket/go.mod
          cache: false
      - name: Go is the toolchain go.mod asks for
        run: scripts/go-toolchain-check.sh ../tailpocket/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Prepare pinned Android dependencies
        run: |
          curl --fail --location --silent --show-error https://github.com/longbridge/nsh/releases/download/v0.4.0/nsh-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nsh.tar.gz"
          echo "8806121aebf40bb51f8fb6aa703722fbb01253f9a435759c18d53beece1ec976  $RUNNER_TEMP/nsh.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/nsh.tar.gz" -C "$RUNNER_TEMP"
          export NSH_HOME="$RUNNER_TEMP/nsh"
          export NSH_BIN="$NSH_HOME/bin/nsh"
          export NSH_AAR="$NSH_HOME/embed/android/nsh.aar"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          "$NSH_BIN" --version
          (cd ../tailpocket && scripts/build-mobile.sh android)
          scripts/gradle-retry.sh ../tailpocket/sdk/android --no-daemon -q publish :tailpocket-nsh:assembleRelease
          mkdir -p android/app/libs android/tailpocket-m2/io/jingtao
          cp ../tailpocket/sdk/android/tailpocket-nsh/build/outputs/aar/tailpocket-nsh-release.aar android/app/libs/tailpocket-nsh.aar
          cp -R ../tailpocket/build/android/m2/io/jingtao/tailpocket android/tailpocket-m2/io/jingtao/
          printf 'NSH_HOME=%s\nNSH_BIN=%s\nNSH_AAR=%s\n' "$NSH_HOME" "$NSH_BIN" "$NSH_AAR" >> "$GITHUB_ENV"
          npm ci --no-audit --no-fund
      - name: Test the candidate before signing
        run: |
          BOOP_REQUIRE_NSH=1 npm test
          python3 -B -m unittest discover -s test -p testflight_ci_test.py
          "$NSH_BIN" check mobile
          "$NSH_BIN" test mobile
      - name: Build with the release key and verify upgrade compatibility
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: scripts/android-release-ci.sh
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/boop-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boop-android-release
          path: |
            boop/android/build/boop.apk
            boop/android/build/release-verification.txt
          if-no-files-found: error
          retention-days: 7
